interface:
  display_name: "Стандарты 1С"
  short_description: "Правила работы и общие стандарты 1С"
  default_prompt: "Используй $1c-standards, чтобы выбрать применимые требования через policy, прочитать точный текст v8std и проверить подтверждения для предлагаемого изменения и результата."

dependencies:
  tools:
    - type: "mcp"
      value: "policy"
      description: "Bundled read-only requirement selection and proposal/result ledger checks"
      transport: "stdio"
    - type: "mcp"
      value: "v8std"
      description: "Required additional work policy, general 1C, diagnostics, and snippet corpus"
      transport: "stdio"
