# Скопируйте в local.yaml при установке напрямую из магазина исходников.
active_project: null
mcp:
  required:
    edt:
      url: ''
    v8std:
      url: ''
  managed:
    code-index:
      enabled: true
      mode: auto
      version: latest
      allow_prerelease: false
    bsl-ls:
      enabled: false
      mode: auto
      version: latest
      allow_prerelease: false
  optional:
    openviking:
      enabled: false
      url: ''
      connection_id: ''
      timeout_seconds: 20
      max_response_bytes: 8388608
# OpenViking также требует явно выбранных режима знаний, провайдера
# и коллекций в профиле проекта. Для подключения нужны enabled: true и непустой URL.
# enabled: false сохраняет URL и запрещает подключение.
# Настройка транспорта сама по себе не изменяет provider: none.
# Учётные данные и подтверждения задаются в общей записи OpenViking через форму.
# latest выбирает стабильные релизы, если не задано allow_prerelease: true.
# Для закрепления релиза задайте version точным тегом, включая предварительный релиз.
# Для внешнего режима задайте mode: external и url. Дополнительные поля подключения:
# headers_env: { Authorization: MY_MCP_AUTH_HEADER } (полное значение заголовка)
# timeout_seconds: 60
# max_response_bytes: 33554432

