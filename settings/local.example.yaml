# Copy as local.yaml when installing directly from the source marketplace.
active_project: null
mcp:
  required:
    edt:
      url: ''
    v8std:
      url: ''
  managed:
    code-index:
      enabled: true
      mode: auto
      version: latest
      allow_prerelease: false
    bsl-ls:
      enabled: false
      mode: auto
      version: latest
      allow_prerelease: false
  optional:
    openviking:
      url: ''
      headers_env: {}
      timeout_seconds: 20
      max_response_bytes: 8388608
# OpenViking also needs an explicitly selected project knowledge mode/provider
# and collections. A nonempty URL enables transport; an empty URL disables it.
# Transport configuration alone does not change provider: none.
# Credential mappings contain environment names, never values:
# headers_env: { Authorization: TEAM_KNOWLEDGE_AUTH }
# latest selects stable releases unless allow_prerelease is true.
# Set version to an exact tag (including a prerelease) to pin a release.
# For external mode set mode: external and url. Advanced connection fields:
# headers_env: { Authorization: MY_MCP_AUTH_HEADER } (the complete header value)
# timeout_seconds: 60
# max_response_bytes: 33554432

