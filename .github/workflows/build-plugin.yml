name: Build 1c-ai-core plugin

on:
  push:
    branches: [develop]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-plugin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: node {0}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PRs use a stable tag, or the source version before the first release.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install developer dependencies and bundle runtime libraries
        run: require('node:child_process').execFileSync(process.execPath, ['tools/ci.mjs', 'install'], {stdio:'inherit'})
      - name: Node regressions
        run: require('node:child_process').execFileSync(process.execPath, ['tools/ci.mjs', 'test'], {stdio:'inherit'})
      - name: Build and verify package
        env:
          GH_TOKEN: ${{ github.token }}
        run: require('node:child_process').execFileSync(process.execPath, ['tools/ci.mjs', 'build'], {stdio:'inherit'})
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: 1c-ai-core-plugin
          # .build is a hidden directory; upload only the explicit files below.
          include-hidden-files: true
          path: |
            .build/*.zip
            .build/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: build
    name: Extracted plugin (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install developer test dependencies
        run: require('node:child_process').execFileSync(process.execPath, ['tools/ci.mjs', 'install'], {stdio:'inherit'})
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: 1c-ai-core-plugin
          path: .build/download
      - name: Verify archives, knowledge contracts and extracted plugin with Node-only PATH
        run: require('node:child_process').execFileSync(process.execPath, ['tools/ci.mjs', 'smoke'], {stdio:'inherit'})
      - name: Runtime regressions
        run: require('node:child_process').execFileSync(process.execPath, ['tools/ci.mjs', 'test'], {stdio:'inherit'})
