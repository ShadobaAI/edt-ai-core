name: Publish 1c-ai-core to codex-plugins

# A release tag or develop push builds first; publication waits for the entire run, including
# the Windows/Linux/macOS smoke matrix. Pull requests never publish.
# Source access stays read-only; only codex-plugins receives a push.
on:
  workflow_run:
    workflows: ["Build 1c-ai-core plugin"]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful tagged release or develop push run of Build 1c-ai-core plugin
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: node {0}

jobs:
  publish:
    # Reject failed, unrelated branch and fork/PR runs before granting a runner/token.
    # The dot is a coarse version filter; the script validates the exact bare
    # version, run identity and downloaded release artifact.
    if: >-
      github.repository == 'ShadobaAI/edt-ai-core' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'develop' || contains(github.event.workflow_run.head_branch, '.'))))
    # Skipped PR events do not take a place in the publication queue.
    concurrency:
      group: publish-1c-ai-core-to-codex-plugins
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Never execute scripts from the triggering tag or downloaded artifact
          # with the publication token. Publication rules come from main.
          ref: ${{ github.event_name == 'workflow_run' && github.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install trusted publication tooling
        run: require('node:child_process').execFileSync(process.execPath, ['tools/ci.mjs', 'install'], {stdio:'inherit'})
      - name: Verify release artifact and publish to codex-plugins
        env:
          GH_TOKEN: ${{ github.token }}
          MARKETPLACE_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id || inputs.build_run_id }}
        run: require('node:child_process').execFileSync(process.execPath, ['tools/ci.mjs', 'publish'], {stdio:'inherit'})
