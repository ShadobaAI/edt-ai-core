version: 0.1.0
description: Descriptive runtime contract; scripts/runtime.py implements release selection.
platform: windows-x64
managed:
  code-index:
    repository: Regsorm/code-index-mcp
    artifact: bsl-indexer-windows-x64.zip
    integrity: github_asset_sha256_and_size
    mode: project_daemon_and_read_only_stdio_client
  bsl-ls:
    repository: 1c-syntax/bsl-language-server
    artifact: bsl-language-server-VERSION-exec.jar
    integrity: github_asset_sha256_and_size
    mode: client_owned_stdio
    prerequisites:
      java: 25+
      node: 18+
user_started:
  - edt
  - v8std
bundled:
  policy:
    entrypoint: policy/read-only-mcp.mjs
    protocol_version: 2.1.0
    prerequisites:
      node: 18+
  vanessa-cli:
    entrypoint: scripts/vanessa.py
    mode: profile_bound_explicit_action
    external_runtime: user_provided
    wire_contract: Vanessa_Single_1.2.043.45_MCP_1.31
    prerequisites:
      node: 18+
      python: 3.12+

